repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-merge-conflict
#  - id: check-docstring-first
  - id: check-symlinks
  - id: check-toml
  - id: check-yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: requirements-txt-fixer
  - id: trailing-whitespace

- repo: https://github.com/sirosen/texthooks
  rev: "815307a61a62d48c84412f34f3e6789a2cd9179a"  # frozen: 0.7.1
  hooks:
  - id: fix-ligatures
  - id: fix-smartquotes

- repo: https://github.com/adamchainz/blacken-docs
  rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
  hooks:
  - id: "blacken-docs"
    additional_dependencies:
    - black==26.*

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 7c55798a78262d14b2074abf623d8a992ebb70d4  # frozen: v0.16.2
  hooks:
  - id: ruff-check
    args: ["--fix"]
  - id: ruff-format
    exclude: ^docs/conf\.py$

- repo: https://github.com/codespell-project/codespell
  rev: "57b21406f092110c18776e39b0bda50d37c945c8"  # frozen: v2.4.3
  hooks:
  - id: codespell
    exclude: "(.png|.svg|^_version.py)$"
    args: ["-L", "ba,endwhile,unparseable"]

- repo: https://github.com/pre-commit/pygrep-hooks
  rev: "3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316"  # frozen: v1.10.0
  hooks:
  - id: rst-backticks
  - id: rst-directive-colons
  - id: rst-inline-touching-normal

- repo: https://github.com/henryiii/check-sdist
  rev: "5230295f53448dcfc8cc4a9eb00cc776ca92f964"  # frozen: v1.6.0
  hooks:
   - id: check-sdist
     args: [--inject-junk]
     additional_dependencies:
     - hatch-fancy-pypi-readme
     - hatch-vcs
     - hatchling

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
  hooks:
  - id: zizmor
    files: "^\\.github"
    args: [--persona=pedantic]

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: "41e691678310dfd3833f7ab4e180ddb014310356"  # frozen: v2.3.0
  hooks:
  - id: mypy
    files: ^(skbuild|tests)
    exclude: ^tests/samples
    additional_dependencies:
    - cmake
    - ninja
    - packaging
    - pytest<8
    - tomli
    - types-requests
    - types-setuptools
