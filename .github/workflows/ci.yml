name: CI

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  tests:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Minimum and maximum stable Python on all OS's, other versions on Linux.
      matrix:
        runs-on: [ubuntu-latest, macos-15-intel, windows-2022, windows-latest]
        python: ["3.10", "3.14"]
        include:
        - { runs-on: ubuntu-latest, python: "3.11" }
        - { runs-on: ubuntu-latest, python: "3.13" }
        - { runs-on: ubuntu-latest, python: "3.15" }

    name: Tests on 🐍 ${{ matrix.python }} • ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Set environment for Fortran compiler on MacOS
      if: runner.os == 'macOS'
      run: |
        brew reinstall gfortran
        echo "FC=gfortran" >> $GITHUB_ENV

    - name: Setup nox
      uses: wntrblm/nox@afa3983bbac3143bab5c8406244327581f76a3d7 # 2026.10.20
      with:
        python-versions: "${{ matrix.python }}"

    - name: Test on 🐍 ${{ matrix.python }}
      shell: bash
      env:
        PYTHON: ${{ matrix.python }}
        # Get a numpy nightly for the nox env until it publishes 3.15 wheels
        # (the pep518 wheelhouse handles this itself in conftest.py).
        UV_EXTRA_INDEX_URL: ${{ matrix.python == '3.15' && 'https://pypi.anaconda.org/scientific-python-nightly-wheels/simple' || '' }}
        UV_PRERELEASE: ${{ matrix.python == '3.15' && 'allow' || 'if-necessary-or-explicit' }}
        # The nightly index also carries scikit-build-core dev builds; without
        # this uv's first-index-wins rule blocks the released version on PyPI.
        UV_INDEX_STRATEGY: ${{ matrix.python == '3.15' && 'unsafe-best-match' || 'first-index' }}
      run: nox -s "tests-$PYTHON" -- --cov --cov-report=xml --cov-report=term --durations=20

    - name: Upload coverage report
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        name: ${{ matrix.runs-on }}-${{ matrix.python }}
        verbose: true


  cygwin:
    name: Tests on 🐍 3.12 • cygwin
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18 # v7.0.0
      with:
        platform: x86_64
        packages: cmake ninja git make gcc-g++ gcc-fortran python312 python312-devel python312-pip

    - name: Install nox
      run: python3.12 -m pip install nox

    - name: Run tests
      env:
        TMP: /tmp
        TEMP: /tmp
      run: python3.12 -m nox -s tests-3.12 -- --durations=20


  tests-pypy:
    name: Tests on 🐍 PyPy 3.11 • ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: yezz123/setup-uv@ab6be5a42627f19dc36e57b548592a5e52cece4a # v4.1

    - name: Setup nox
      uses: wntrblm/nox@afa3983bbac3143bab5c8406244327581f76a3d7 # 2026.10.20

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: pypy3.11-v7.3.22

    - name: Test on 🐍 PyPy
      shell: bash
      run: |
        deselect=()
        if [[ "$RUNNER_OS" == "Windows" ]]; then deselect=(-k "not pep518"); fi
        nox -s tests-pypy3.11 -- --cov --cov-report=xml --cov-report=term --durations=20 "${deselect[@]}"

    - name: Upload coverage report
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        name: ${{ runner.os }}-pypy3.11
        verbose: true


  sample-projects:
    name: Sample projects on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: scikit-build/scikit-build-sample-projects
        # Pinned so sample-projects changes can't break this repo's CI; bump deliberately.
        ref: 0ad0bd760a3f2df4d7e21a3c89d5e49353304c32
        path: scikit-build-sample-projects
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Setup nox
      uses: wntrblm/nox@afa3983bbac3143bab5c8406244327581f76a3d7 # 2026.10.20

    - name: Build sample projects
      run: nox -s sample_projects


  dist:
    name: Distribution
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Build SDist and wheel
      run: pipx run build

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: dist/*

    - name: Check metadata
      run: pipx run twine check dist/*


  pass:
    name: Pass
    if: always()
    timeout-minutes: 1
    needs: [lint, tests, tests-pypy, sample-projects, dist]
    runs-on: ubuntu-slim
    steps:
     - name: Decide whether the needed jobs succeeded or failed
       uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
       with:
         jobs: ${{ toJSON(needs) }}
